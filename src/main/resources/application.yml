spring:
  application:
    name: helpdesk
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${SPRING_DATASOURCE_USERNAME:helpdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:helpdesk}
    hikari:
      initialization-fail-timeout: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns:
      - "*:missing"
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

info:
  app:
    name: helpdesk
    description: Сервис обработки заявок технической поддержки

springdoc:
  paths-to-exclude: /error
