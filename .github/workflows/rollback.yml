name: rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: SHA коммита, к образу которого нужно вернуться
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    name: Возврат к предыдущему образу
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить тег
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Тег должен быть SHA коммита" >&2
            exit 1
          fi
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "HELPDESK_IMAGE=ghcr.io/${owner}/helpdesk:${IMAGE_TAG}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Запуск выбранного образа
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: docker compose up -d --wait --no-build
      - name: Проверка после отката
        run: bash scripts/smoke.sh
      - name: Остановка стенда
        if: always()
        run: docker compose down -v
